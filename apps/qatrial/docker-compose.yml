services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://qatrial:qatrial@db:5432/qatrial
      - JWT_SECRET=${JWT_SECRET:-qatrial-production-secret-change-me-32chars-min}
      - AI_PROVIDER_TYPE=${AI_PROVIDER_TYPE:-}
      - AI_PROVIDER_URL=${AI_PROVIDER_URL:-}
      - AI_PROVIDER_KEY=${AI_PROVIDER_KEY:-}
      - AI_PROVIDER_MODEL=${AI_PROVIDER_MODEL:-}
      - SSO_ENABLED=${SSO_ENABLED:-false}
      - SSO_ISSUER_URL=${SSO_ISSUER_URL:-}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID:-}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET:-}
      - SSO_CALLBACK_URL=${SSO_CALLBACK_URL:-http://localhost:3001/api/auth/sso/callback}
      - SSO_ROLE_CLAIM=${SSO_ROLE_CLAIM:-gsms_role}
      - SSO_ORG_NAME=${SSO_ORG_NAME:-GSMS}
      - SSO_PROVIDER_NAME=${SSO_PROVIDER_NAME:-GSMS}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - ./prisma.config.ts:/app/prisma.config.ts:ro
    command: ["npx", "tsx", "server/index.ts"]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=qatrial
      - POSTGRES_PASSWORD=qatrial
      - POSTGRES_DB=qatrial
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qatrial"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
