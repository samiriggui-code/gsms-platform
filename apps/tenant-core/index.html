<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSMS — Espace client</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("gsms.portal.theme");
          /* Défaut clair comme DocuLens AI (captures) */
          var dark = t === "dark";
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.tsx"></script>
  </body>
</html>
