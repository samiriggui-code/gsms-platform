# DocuLens (mode GSMS Core) : fichiers statiques + relais vers le Core sur le réseau Docker interne.
# Seules les routes dont DocuLens a besoin sont exposées (connexion et API des workspaces).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dépôt de documents : même plafond que le Core (GSMS_MAX_UPLOAD_MB, 100 Mo par défaut).
    client_max_body_size 100m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/api/v1/(auth|workspaces)/ {
        proxy_pass http://core:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Le reste de l'API du Core n'est pas exposé ici (pas de repli sur la page HTML).
    location /api/ {
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri $uri/ /index.html;
    }
}
