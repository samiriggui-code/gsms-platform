# Comp CRM — VPS Hostinger (Traefik edge). Sans Caddy (déjà sur NUC).
# Smoke : http://187.77.166.124:3040 — DNS A crm → VPS seulement après GO.
name: gsms-crm

services:
  db:
    image: postgres:17-alpine
    container_name: gsms-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: crm
    volumes:
      - gsms_crm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d crm']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - crm

  migrate:
    build:
      context: ../..
      dockerfile: deploy/nuc/Dockerfile.api
    restart: 'no'
    working_dir: /app/packages/db
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/crm?schema=public
    command: ['bunx', 'prisma', 'migrate', 'deploy']
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm

  redis:
    image: redis:7-alpine
    container_name: gsms-crm-redis
    restart: unless-stopped
    volumes:
      - gsms_crm_redis:/data
    networks:
      - crm

  minio:
    image: minio/minio:latest
    container_name: gsms-crm-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_SERVER_URL: http://minio:9000
      MINIO_BROWSER_REDIRECT_URL: https://minio.gsms-security.com
    volumes:
      - gsms_crm_minio:/data
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - crm
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.crm-blob-strip.stripprefix.prefixes=/blob
      - traefik.http.routers.crm-blob.entrypoints=websecure
      - traefik.http.routers.crm-blob.rule=Host(`crm.gsms-security.com`) && PathPrefix(`/blob`)
      - traefik.http.routers.crm-blob.middlewares=crm-blob-strip
      - traefik.http.routers.crm-blob.tls=true
      - traefik.http.routers.crm-blob.priority=90
      - traefik.http.routers.crm-blob.service=crm-blob
      - traefik.http.services.crm-blob.loadbalancer.server.port=9000
      - traefik.http.routers.minio-console.entrypoints=websecure
      - traefik.http.routers.minio-console.rule=Host(`minio.gsms-security.com`)
      - traefik.http.routers.minio-console.tls.certresolver=letsencrypt
      - traefik.http.routers.minio-console.service=minio-console
      - traefik.http.services.minio-console.loadbalancer.server.port=9001

  minio-init:
    image: minio/mc:latest
    restart: 'no'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-crm-blob}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb -p "local/$$S3_BUCKET" &&
        mc anonymous set download "local/$$S3_BUCKET"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - crm

  api:
    build:
      context: ../..
      dockerfile: deploy/nuc/Dockerfile.api
    container_name: gsms-crm-api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/crm?schema=public
      API_URL: http://api:3001
      AGENT_URL: http://agent:2000
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-crm-blob}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CRM_TELEMETRY_DISABLED: '1'
    ports:
      - '3041:3001'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks:
      - crm
    labels:
      - traefik.enable=true
      - traefik.http.routers.crm-api.entrypoints=websecure
      - traefik.http.routers.crm-api.rule=Host(`crm.gsms-security.com`) && (PathPrefix(`/api/trpc`) || PathPrefix(`/api/t`) || PathPrefix(`/api/conversations`) || PathPrefix(`/api/public`) || PathPrefix(`/auth`) || PathPrefix(`/health`))
      - traefik.http.routers.crm-api.tls=true
      - traefik.http.routers.crm-api.priority=100
      - traefik.http.services.crm-api.loadbalancer.server.port=3001

  cron:
    image: alpine:3.20
    container_name: gsms-crm-cron
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
    volumes:
      - ../nuc/crontab:/etc/crontabs/root:ro
    command: ['sh', '-c', 'apk add --no-cache curl >/dev/null && exec crond -f -l 8']
    depends_on:
      - api
    networks:
      - crm

  agent:
    build:
      context: ../..
      dockerfile: deploy/nuc/Dockerfile.agent
    container_name: gsms-crm-agent
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      AGENT_PORT: '2000'
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/crm?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-crm-blob}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CRM_TELEMETRY_DISABLED: '1'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - crm

  app:
    build:
      context: ../..
      dockerfile: deploy/nuc/Dockerfile.app
      args:
        NEXT_PUBLIC_API_URL: ${APP_URL:?set APP_URL in .env}
        S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    container_name: gsms-crm-app
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/crm?schema=public
      API_URL: http://api:3001
    ports:
      - '3040:3000'
    depends_on:
      - api
    networks:
      - crm
    labels:
      - traefik.enable=true
      - traefik.http.routers.crm-app.entrypoints=websecure
      - traefik.http.routers.crm-app.rule=Host(`crm.gsms-security.com`)
      - traefik.http.routers.crm-app.tls.certresolver=letsencrypt
      - traefik.http.routers.crm-app.priority=10
      - traefik.http.services.crm-app.loadbalancer.server.port=3000

volumes:
  gsms_crm_pg:
  gsms_crm_redis:
  gsms_crm_minio:

networks:
  crm:
    name: gsms-crm
