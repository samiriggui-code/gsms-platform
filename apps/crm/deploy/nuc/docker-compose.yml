name: crm

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: crm
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: deploy/nuc/Dockerfile.api
    restart: "no"
    working_dir: /app/packages/db
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/crm?schema=public
    command: ["bunx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_SERVER_URL: http://minio:9000
      MINIO_BROWSER_REDIRECT_URL: https://minio.global-it-ss.com
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-crm-blob}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb -p "local/$$S3_BUCKET" &&
        mc anonymous set download "local/$$S3_BUCKET"
    depends_on:
      minio:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: deploy/nuc/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/crm?schema=public
      API_URL: http://api:3001
      AGENT_URL: http://agent:2000
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-crm-blob}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CRM_TELEMETRY_DISABLED: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
    volumes:
      - ./crontab:/etc/crontabs/root:ro
    command: ["sh", "-c", "apk add --no-cache curl >/dev/null && exec crond -f -l 8"]
    depends_on:
      - api

  agent:
    build:
      context: ../..
      dockerfile: deploy/nuc/Dockerfile.agent
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      AGENT_PORT: "2000"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/crm?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-crm-blob}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CRM_TELEMETRY_DISABLED: "1"
    # Gives eve's Docker sandbox backend a real daemon to spawn sandboxed
    # containers against, so the research agent's bash tool keeps its
    # deny-all network policy instead of silently falling through to eve's
    # just-bash backend, which cannot enforce one at all. This grants the
    # agent container the same control over the host as root — acceptable
    # here because the agent process itself is trusted first-party code; it
    # is what launches the untrusted sandbox, not what runs inside it.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  app:
    build:
      context: ../..
      dockerfile: deploy/nuc/Dockerfile.app
      args:
        NEXT_PUBLIC_API_URL: ${APP_URL:?set APP_URL in .env}
        S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/crm?schema=public
      API_URL: http://api:3001
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # The host's /etc/resolv.conf points at systemd-resolved's stub
    # (127.0.0.53), which containers can't reach — Caddy needs real DNS to
    # resolve Let's Encrypt during cert issuance.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?set CRM_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./admin:/srv/admin:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - api

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          pg_dump -h db -U postgres -d crm -Fc -f "/backups/crm-$$ts.dump" && echo "backup crm-$$ts.dump done"
          find /backups -name "crm-*.dump" -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
