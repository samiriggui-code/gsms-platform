[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gsms-core"
version = "0.1.0"
description = "GSMS Core — identité, missions, documents, événements, workflows et audit de la plateforme GSMS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
s3 = ["boto3>=1.34"]
# Moteur de parsing documentaire (lourd : modèles de layout/OCR). Absent en CI : DoclingAdapter est
# testé avec un faux convertisseur. En production : image Core ou worker dédié avec cet extra.
docling = ["docling>=2.50"]

[tool.hatch.build.targets.wheel]
packages = ["gsms_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
  "error::DeprecationWarning:gsms_core.*",
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # assert dans les tests
  "B008",   # Depends() dans les signatures FastAPI
  "RUF012", # attributs de classe mutables des définitions de workflow
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108"]
"gsms_core/scripts/**" = ["S105", "S106"]
