{% macro infos(lignes) %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:16px 0;border:1px solid #e5e7eb;border-radius:8px;">
{% for libelle, valeur in lignes if valeur %}
  <tr>
    <td style="padding:8px 12px;font-size:13px;color:#6b7280;width:38%;border-bottom:1px solid #f3f4f6;vertical-align:top;">{{ libelle }}</td>
    <td style="padding:8px 12px;font-size:14px;color:#111827;border-bottom:1px solid #f3f4f6;">{{ valeur }}</td>
  </tr>
{% endfor %}
</table>
{% endmacro %}
{% macro liste(elements) %}
<ul style="margin:8px 0 16px;padding-left:20px;">
{% for e in elements %}<li style="margin:4px 0;">{{ e }}</li>{% endfor %}
</ul>
{% endmacro %}
{% macro echeance(texte) %}
<p style="margin:16px 0;padding:10px 12px;background:#fff7e6;border-left:3px solid #a15c07;font-size:14px;"><strong>Échéance :</strong> {{ texte }}</p>
{% endmacro %}
