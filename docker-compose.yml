# GSMS Platform — base PostgreSQL, Core (FastAPI), Web (Next.js), DocuLens (interface documentaire).
# Sur le VPS : ./deploy/deploy.sh gsms-security.com (ajoute deploy/docker-compose.prod.yml + le branchement Traefik).
# Secrets obligatoires (pas de valeur par défaut) : POSTGRES_PASSWORD, GSMS_JWT_SECRET. Voir deploy/README.md.
#
# Nom de projet fixe : le réseau interne s'appelle toujours « gsms-platform_default », quel que soit le dossier
# du clone. C'est ce réseau que Traefik (mode host) rejoint ; aucun réseau partagé avec les autres applications.
name: gsms-platform

services:
  db:
    # PostgreSQL 16 avec l'extension pgvector disponible (recherche documentaire du Core, migrations à venir).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gsms_core
      POSTGRES_USER: gsms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
    volumes:
      - gsms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsms -d gsms_core"]
      interval: 5s
      timeout: 5s
      retries: 20

  core:
    build:
      context: ./apps/core
      additional_contexts:
        shared: ./shared
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GSMS_ENV: ${GSMS_ENV:-prod}
      GSMS_DATABASE_URL: postgresql+psycopg://gsms:${POSTGRES_PASSWORD}@db:5432/gsms_core
      GSMS_JWT_SECRET: ${GSMS_JWT_SECRET:?GSMS_JWT_SECRET est obligatoire (32 caractères minimum)}
      GSMS_JWT_TTL_MINUTES: ${GSMS_JWT_TTL_MINUTES:-480}
      GSMS_STORAGE_BACKEND: local
      # Coffre-fort : clé maître qui enveloppe la clé de chaque workspace (générée par deploy.sh).
      # La perdre rend tous les documents illisibles : sauvegarder .env hors du serveur.
      GSMS_STORAGE_MASTER_KEY: ${GSMS_STORAGE_MASTER_KEY:?GSMS_STORAGE_MASTER_KEY est obligatoire}
      # Fichiers d'avant le coffre-fort (en clair), chiffrés par « gsms_core.cli vault-migrate ».
      GSMS_LEGACY_STORAGE_ROOT: /app/var/blobs
      # JSON {"grace": "...", "qatrial": "...", "crm": "..."} — généré par deploy/deploy.sh.
      GSMS_WEBHOOK_SECRETS: ${GSMS_WEBHOOK_SECRETS:?GSMS_WEBHOOK_SECRETS est obligatoire}
      GSMS_CRM_URL: ${GSMS_CRM_URL:-}
      GSMS_CRM_TOKEN: ${GSMS_CRM_TOKEN:-}
      GSMS_GRACE_URL: ${GSMS_GRACE_URL:-}
      GSMS_GRACE_TOKEN: ${GSMS_GRACE_TOKEN:-}
      GSMS_QATRIAL_URL: ${GSMS_QATRIAL_URL:-}
      GSMS_QATRIAL_TOKEN: ${GSMS_QATRIAL_TOKEN:-}
      GSMS_TENDERAI_MCP_URL: ${GSMS_TENDERAI_MCP_URL:-}
      GSMS_TENDERAI_MCP_TOKEN: ${GSMS_TENDERAI_MCP_TOKEN:-}
    volumes:
      - gsms-documents:/app/var/blobs
    # Local uniquement (exploitation / débogage), jamais exposé sur Internet.
    ports:
      - "127.0.0.1:${CORE_PORT:-8100}:8000"

  web:
    build: ./apps/web
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    environment:
      # Le navigateur ne parle qu'au web ; le web relaie vers le Core sur le réseau interne.
      CORE_API_URL: http://core:8000
      CORE_TIMEOUT_MS: ${CORE_TIMEOUT_MS:-5000}
      # Obligatoire derrière Traefik : Next écoute sur 0.0.0.0, sans ça les redirects
      # partent vers https://0.0.0.0:3000/…
      APP_URL: ${APP_URL:-http://localhost:${WEB_PORT:-3100}}
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"

  doculens:
    # Interface documentaire (DocuLens) branchée sur le Core : nginx sert l'interface et relaie l'API du
    # Core sur le même domaine (doculens.DOMAIN). Analyse Docling et Digest restent dans le Core.
    build:
      context: ./apps/doculens
      dockerfile: docker/Dockerfile.gsms
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DOCULENS_PORT:-3110}:80"

volumes:
  gsms-postgres:
  gsms-documents:
