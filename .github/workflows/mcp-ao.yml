name: mcp-ao

on:
  push:
    paths: ["apps/tenderai-mcp-server-max/**", ".github/workflows/mcp-ao.yml"]
  pull_request:
    paths: ["apps/tenderai-mcp-server-max/**", ".github/workflows/mcp-ao.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tenderai-mcp-server-max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/tenderai-mcp-server-max/requirements.txt
            apps/tenderai-mcp-server-max/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
