# GSMS NUC — RiskManager all-in-one (no external volume on /var/lib/mysql — broken bind)
services:
  simplerisk:
    container_name: gsms-riskmanager
    image: simplerisk/simplerisk:latest
    ports:
      - "8081:80"
      - "8444:443"
    volumes:
      - riskmanager-uploads:/var/www/simplerisk/uploads
    restart: unless-stopped

volumes:
  riskmanager-uploads:
